version: 1
backend:
  phases:
    build:
      commands:
        - npm install --frozen-lockfile false
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --frozen-lockfile false
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
redirects:
  - source: '/<*>'
    target: '/index.html'
    status: '200'
