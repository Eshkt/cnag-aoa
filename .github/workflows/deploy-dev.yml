name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install -g aws-cdk

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Create AWS Profile
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} --profile aoa-dev
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} --profile aoa-dev
          aws configure set region ap-southeast-1 --profile aoa-dev

      - name: Run Deploy Script
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Upload .env.dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-dev
          path: .env.dev

      - name: Send Slack Notification
        if: success()
        run: |
          API_URL=$(grep API_URL .env.dev | cut -d'=' -f2)
          curl -X POST -H 'Content-type: application/json' --data "{\"text\":\"AOA dev deploy passed. API: $API_URL\"}" ${{ secrets.SLACK_WEBHOOK }}
