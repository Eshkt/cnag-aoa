name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          # No CDK install needed, using Terraform

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Setup AWS Profile
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} --profile aoa-dev
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} --profile aoa-dev
          aws configure set region ap-southeast-1 --profile aoa-dev

      - name: Create tfvars
        run: |
          echo "account_id=\"${{ secrets.AWS_ACCOUNT_ID }}\"" > terraform/terraform.tfvars
          echo "comelec_phone_number=\"${{ secrets.COMELEC_PHONE }}\"" >> terraform/terraform.tfvars
          echo "region=\"ap-southeast-1\"" >> terraform/terraform.tfvars
          echo "stack_name=\"AoaVotingStack\"" >> terraform/terraform.tfvars

      - name: Run Deploy Script
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Upload .env.dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-dev
          path: .env.dev
